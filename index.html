<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شجرة العائلة - النسخة المستقرة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8d08a;
    --gold-dark: #8b6914;
    --bg-deep: #0d0a05;
    --bg-card: #1a1308;
    --bg-hover: #231b0a;
    --text: #f0e6c8;
    --text-muted: #a89060;
    --border: #3d2e0e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
  }

  /* زخرفة الخلفية */
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(201,168,76,0.05) 0%, transparent 80%);
    pointer-events: none; z-index: 0;
  }

  .header { text-align: center; padding: 40px 20px 10px; position: relative; z-index: 10; }
  .header h1 { font-family: 'Amiri', serif; font-size: 3rem; color: var(--gold-light); }

  .stats-bar {
    display: flex; gap: 30px; justify-content: center; padding: 15px;
    background: rgba(201,168,76,0.03); border-block: 1px solid var(--border);
    margin: 20px 0; position: relative; z-index: 10;
  }
  .stat-num { font-size: 1.5rem; font-weight: 700; color: var(--gold); font-family: 'Amiri', serif; }

  .controls { 
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; 
    padding: 10px 20px 30px; position: relative; z-index: 20; 
  }
  
  .btn {
    font-family: 'Cairo', sans-serif; padding: 10px 22px; border-radius: 8px;
    border: 1px solid var(--gold-dark); background: rgba(201,168,76,0.1);
    color: var(--gold-light); cursor: pointer; font-size: 0.9rem; font-weight: 600;
    transition: all 0.3s ease;
  }
  .btn:hover { background: var(--gold-dark); color: #000; transform: translateY(-2px); }
  .btn.primary { background: var(--gold); color: #000; border-color: var(--gold-light); }

  .tree-container { 
    position: relative; z-index: 1; padding: 40px; 
    overflow: auto; width: 100%; display: flex; justify-content: center;
  }

  .connector { fill: none; stroke: #5a3d0a; stroke-width: 2; opacity: 0.6; }
  .node-group { cursor: pointer; transition: filter 0.3s; }
  .node-group:hover { filter: brightness(1.3); }
  .node-name { font-size: 14px; font-weight: 700; fill: #f0e6c8; text-anchor: middle; dominant-baseline: middle; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(8px);
  }
  .modal-overlay.open { display: flex !important; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--gold); border-radius: 15px;
    width: min(450px, 95vw); padding: 30px; box-shadow: 0 0 50px rgba(0,0,0,0.5);
  }

  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
  .form-group input, .form-group select {
    width: 100%; background: #000; border: 1px solid var(--border);
    padding: 12px; color: #fff; border-radius: 8px; font-family: inherit;
  }

  .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
  .modal-actions .btn { flex: 1; }

  /* الطباعة */
  @media print {
    @page { size: landscape; margin: 0; }
    body { background: #fff !important; }
    .controls, .stats-bar, .modal-overlay, body::before { display: none !important; }
    .header h1 { color: #000 !important; }
    .tree-container { padding: 0 !important; overflow: visible !important; }
    #tree-svg { max-width: 100%; height: auto !important; }
    rect { fill: #fcfcfc !important; stroke: #000 !important; }
    .node-name { fill: #000 !important; }
    .connector { stroke: #333 !important; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>شجرة العائلة</h1>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="stat-total">0</span> <span class="stat-label">فرد</span></div>
  <div class="stat"><span class="stat-num" id="stat-gen">0</span> <span class="stat-label">جيل</span></div>
</div>

<div class="controls">
  <button class="btn primary" onclick="openAddModal()">＋ إضافة فرد جديد</button>
  <button class="btn" onclick="window.print()">🖨 طباعة</button>
  <button class="btn" onclick="exportData()">⬇ تصدير (حفظ نسخة)</button>
  <button class="btn" onclick="document.getElementById('imp-file').click()">⬆ استيراد (رفع نسخة)</button>
</div>

<div class="tree-container">
  <div id="empty-msg" style="display:none; padding:100px; color:var(--text-muted);">الشجرة فارغة، أضف أول فرد للبدء.</div>
  <svg id="tree-svg"></svg>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title" style="text-align:center; margin-bottom:20px;">إضافة فرد</h2>
    <div class="form-group">
      <label>الاسم الكامل</label>
      <input type="text" id="f-name" placeholder="أدخل الاسم هنا...">
    </div>
    <div class="form-group">
      <label>يرتبط بـ (الأب)</label>
      <select id="f-parent"></select>
    </div>
    <div class="modal-actions">
      <button class="btn primary" onclick="savePerson()">حفظ البيانات</button>
      <button class="btn danger" id="del-btn" style="display:none" onclick="deletePerson()">حذف</button>
      <button class="btn" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <h2 id="d-name" style="text-align:center; color:var(--gold-light);"></h2>
    <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
    <div id="d-info"></div>
    <div class="modal-actions">
      <button class="btn primary" id="d-btn-add">＋ إضافة ابن</button>
      <button class="btn" id="d-btn-edit">تعديل</button>
      <button class="btn" onclick="closeDetail()">إغلاق</button>
    </div>
  </div>
</div>

<input type="file" id="imp-file" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const NODE_W = 150, NODE_H = 50, H_GAP = 40, V_GAP = 70;
let people = JSON.parse(localStorage.getItem('family_v3') || '[]');
let editingId = null;

const saveToLocal = () => localStorage.setItem('family_v3', JSON.stringify(people));
const byId = id => people.find(p => p.id === id);
const getSons = id => people.filter(p => p.parentId === id);

function getGen(p) {
  let g = 0, cur = p;
  while (cur && cur.parentId) { g++; cur = byId(cur.parentId); }
  return g;
}

function calculateSubtreeWidth(id) {
  const sons = getSons(id);
  if (sons.length === 0) return NODE_W + H_GAP;
  return sons.reduce((total, son) => total + calculateSubtreeWidth(son.id), 0);
}

function assignPositions(id, startX) {
  const node = byId(id);
  const totalW = calculateSubtreeWidth(id);
  node._x = startX + totalW / 2 - NODE_W / 2;
  
  let currentX = startX;
  getSons(id).forEach(son => {
    assignPositions(son.id, currentX);
    currentX += calculateSubtreeWidth(son.id);
  });
}

function render() {
  const svg = document.getElementById('tree-svg');
  const empty = document.getElementById('empty-msg');
  
  // تحديث الإحصائيات
  document.getElementById('stat-total').textContent = people.length;
  const gens = new Set(people.map(p => getGen(p)));
  document.getElementById('stat-gen').textContent = people.length ? gens.size : 0;

  if (people.length === 0) {
    empty.style.display = 'block';
    svg.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  const roots = people.filter(p => !p.parentId);
  let startX = 0;
  roots.forEach(r => {
    assignPositions(r.id, startX);
    startX += calculateSubtreeWidth(r.id) + 100;
  });

  const maxGen = Math.max(...people.map(p => getGen(p)));
  svg.setAttribute('width', startX);
  svg.setAttribute('height', (maxGen + 1) * (NODE_H + V_GAP) + 100);

  let html = '';
  // رسم الخطوط أولاً لتكون خلف الصناديق
  people.forEach(p => {
    if (!p.parentId) return;
    const parent = byId(p.parentId);
    const x1 = parent._x + NODE_W / 2, y1 = getGen(parent) * (NODE_H + V_GAP) + NODE_H + 40;
    const x2 = p._x + NODE_W / 2, y2 = getGen(p) * (NODE_H + V_GAP) + 40;
    html += `<path class="connector" d="M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}" />`;
  });

  // رسم الصناديق
  people.forEach(p => {
    const x = p._x, y = getGen(p) * (NODE_H + V_GAP) + 40;
    const bgColor = p.parentId ? 'var(--bg-card)' : '#1e3a2a';
    html += `
      <g class="node-group" onclick="showDetail('${p.id}')">
        <rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="10" fill="${bgColor}" stroke="var(--gold)" stroke-width="1.5" />
        <text class="node-name" x="${x + NODE_W / 2}" y="${y + NODE_H / 2 + 5}">${p.name}</text>
      </g>
    `;
  });
  svg.innerHTML = html;
}

// أزرار التحكم
function openAddModal(pid = null) {
  editingId = null;
  document.getElementById('modal-title').textContent = "إضافة فرد جديد";
  document.getElementById('f-name').value = "";
  document.getElementById('del-btn').style.display = 'none';
  
  const sel = document.getElementById('f-parent');
  sel.innerHTML = '<option value="">— أصل الشجرة —</option>';
  people.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.name}</option>`);
  
  if (pid) sel.value = pid;
  document.getElementById('modal').classList.add('open');
}

function savePerson() {
  const name = document.getElementById('f-name').value.trim();
  const parentId = document.getElementById('f-parent').value || null;
  
  if (!name) return alert("يرجى كتابة الاسم");
  
  if (editingId) {
    const p = byId(editingId);
    p.name = name;
    p.parentId = parentId;
  } else {
    people.push({ id: 'id' + Date.now(), name, parentId });
  }
  
  saveToLocal();
  closeModal();
  render();
}

function showDetail(id) {
  const p = byId(id);
  const sons = getSons(id);
  document.getElementById('d-name').textContent = p.name;
  document.getElementById('d-info').innerHTML = `<p style="text-align:center; color:var(--text-muted);">عدد الأبناء المباشرين: ${sons.length}</p>`;
  
  document.getElementById('d-btn-add').onclick = () => { closeDetail(); openAddModal(id); };
  document.getElementById('d-btn-edit').onclick = () => { closeDetail(); openEdit(id); };
  document.getElementById('detail-modal').classList.add('open');
}

function openEdit(id) {
  editingId = id;
  const p = byId(id);
  document.getElementById('modal-title').textContent = "تعديل بيانات";
  document.getElementById('f-name').value = p.name;
  document.getElementById('del-btn').style.display = 'block';
  
  const sel = document.getElementById('f-parent');
  sel.innerHTML = '<option value="">— أصل الشجرة —</option>';
  people.filter(x => x.id !== id).forEach(x => sel.innerHTML += `<option value="${x.id}">${x.name}</option>`);
  sel.value = p.parentId || "";
  
  document.getElementById('modal').classList.add('open');
}

function deletePerson() {
  if (!confirm("هل أنت متأكد من الحذف؟ سيتم حذف جميع الفروع التابعة له أيضاً.")) return;
  
  const toDelete = new Set();
  const finder = (id) => {
    toDelete.add(id);
    getSons(id).forEach(s => finder(s.id));
  };
  finder(editingId);
  
  people = people.filter(p => !toDelete.has(p.id));
  saveToLocal();
  closeModal();
  render();
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeDetail() { document.getElementById('detail-modal').classList.remove('open'); }

// إصلاح التصدير والاستيراد
function exportData() {
  if (people.length === 0) return alert("لا توجد بيانات لتصديرها");
  const dataStr = JSON.stringify(people, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `family_tree_${new Date().toLocaleDateString()}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const imported = JSON.parse(event.target.result);
      if (Array.isArray(imported)) {
        people = imported;
        saveToLocal();
        render();
        alert("تم استيراد البيانات بنجاح");
      }
    } catch (err) {
      alert("خطأ في قراءة الملف");
    }
  };
  reader.readAsText(file);
  e.target.value = ""; // لإتاحة رفع نفس الملف مرة أخرى
}

// التشغيل الأولي
render();
</script>

</body>
</html>
