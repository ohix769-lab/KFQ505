<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شجرة العائلة المطورة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8d08a;
    --gold-dark: #8b6914;
    --bg-deep: #0d0a05;
    --bg-card: #1a1308;
    --bg-hover: #231b0a;
    --text: #f0e6c8;
    --text-muted: #a89060;
    --border: #3d2e0e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 20%, rgba(201,168,76,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(122,59,0,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .header { text-align: center; padding: 36px 20px 16px; position: relative; z-index: 1; }
  .header-ornament { font-family: 'Amiri', serif; font-size: 1.1rem; color: var(--gold); letter-spacing: 6px; opacity: 0.7; margin-bottom: 6px; }
  .header h1 { font-family: 'Amiri', serif; font-size: clamp(2rem, 5vw, 3.2rem); color: var(--gold-light); text-shadow: 0 0 40px rgba(201,168,76,0.3); margin-bottom: 4px; }
  .header-line { width: 160px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 8px auto; }
  .header p { color: var(--text-muted); font-size: 0.88rem; font-weight: 300; }

  .stats-bar {
    display: flex; gap: 24px; justify-content: center; padding: 14px;
    background: rgba(201,168,76,0.04); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    margin: 16px 0; position: relative; z-index: 1;
  }
  .stat-num { font-size: 1.4rem; font-weight: 700; color: var(--gold); font-family: 'Amiri', serif; }
  .stat-label { font-size: 0.73rem; color: var(--text-muted); }

  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 20px 18px; position: relative; z-index: 1; }
  
  .btn {
    font-family: 'Cairo', sans-serif; padding: 9px 20px; border-radius: 5px;
    border: 1px solid var(--gold-dark); background: rgba(201,168,76,0.1);
    color: var(--gold-light); cursor: pointer; font-size: 0.86rem; font-weight: 600; transition: all 0.22s;
  }
 . btn:hover { background: rgba(201,168,76,0.22); border-color: var(--gold); }
  .btn.primary { background: linear-gradient(135deg, #c9a84c, #8b6914); border-color: var(--gold); color: #1a1000; font-weight: 700; }
  .btn.danger { background: rgba(180,40,40,0.15); border-color: #7a2020; color: #e88; }
  .btn.success { background: rgba(40,180,80,0.15); border-color: #207a30; color: #8e8; }

  .tree-wrapper { position: relative; z-index: 1; padding: 10px 20px 20px; overflow: auto; text-align: center; }
  #tree-svg { display: block; margin: auto; }

  .connector { fill: none; stroke: #5a3d0a; stroke-width: 1.5; opacity: 0.7; }
  .node-group { cursor: pointer; }
  .node-name { font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700; fill: #f0e6c8; text-anchor: middle; dominant-baseline: middle; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--gold-dark); border-radius: 12px;
    width: min(420px, 93vw); padding: 25px; position: relative; animation: slideUp 0.28s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-close { position: absolute; top: 12px; left: 14px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
  .form-group input, .form-group select {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    padding: 10px; color: var(--text); border-radius: 6px; font-family: inherit;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; }

  .detail-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .detail-label { color: var(--text-muted); font-size: 0.8rem; display: block; }
  .detail-value { font-size: 1rem; color: var(--gold-light); }
</style>
</head>
<body>

<div class="header">
  <div class="header-ornament">❧ ❧ ❧</div>
  <h1>شجرة العائلة</h1>
  <div class="header-line"></div>
  <p>سِجِلُّ الأُسرة وذاكرتها</p>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">إجمالي الأفراد</div></div>
  <div class="stat"><div class="stat-num" id="stat-gen">0</div><div class="stat-label">عدد الأجيال</div></div>
</div>

<div class="controls">
  <button class="btn primary" onclick="openAddModal()">＋ إضافة فرد جديد</button>
  <button class="btn" onclick="exportData()">⬇ تصدير</button>
  <button class="btn" onclick="document.getElementById('imp').click()">⬆ استيراد</button>
</div>

<div class="tree-wrapper">
  <div id="empty-state" style="padding: 50px; color: var(--text-muted);">
    <p>الشجرة فارغة، ابدأ بإضافة أول فرد (الجد)</p>
  </div>
  <svg id="tree-svg"></svg>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="modal-title" style="text-align:center; color:var(--gold-light); margin-bottom:15px;">إضافة فرد</h2>
    <div class="form-group">
      <label>الاسم الكامل *</label>
      <input type="text" id="f-name" placeholder="مثال: محمد بن فهد">
    </div>
    <div class="form-group">
      <label>اسم الأب (الارتباط)</label>
      <select id="f-parent"></select>
    </div>
    <div class="modal-actions">
      <button class="btn primary" onclick="savePerson()">💾 حفظ</button>
      <button class="btn danger" id="del-btn" style="display:none" onclick="deletePerson()">🗑 حذف</button>
      <button class="btn" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeDetail()">✕</button>
    <h2 id="d-name" style="text-align:center; color:var(--gold-light);"></h2>
    <div style="height:1px; background:var(--gold-dark); margin:15px 0; opacity:0.3;"></div>
    
    <div id="d-body">
      </div>

    <div class="modal-actions" style="margin-top:20px">
      <button class="btn success" id="d-add-son">＋ إضافة ابن</button>
      <button class="btn" id="d-edit">✏ تعديل</button>
      <button class="btn" onclick="closeDetail()">إغلاق</button>
    </div>
  </div>
</div>

<input type="file" id="imp" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const NODE_W = 140, NODE_H = 50, H_GAP = 30, V_GAP = 60;
let people = JSON.parse(localStorage.getItem('family_data') || '[]');
let editingId = null;

const save = () => localStorage.setItem('family_data', JSON.stringify(people));
const byId = id => people.find(p => p.id === id);
const getKids = id => people.filter(p => p.parentId === id);

function getGen(p) {
    let g = 0, cur = p;
    while (cur && cur.parentId) { g++; cur = byId(cur.parentId); }
    return g;
}

// Layout Logic
function calcWidth(id) {
    const ch = getKids(id);
    if (!ch.length) return NODE_W + H_GAP;
    return ch.reduce((s, k) => s + calcWidth(k.id), 0);
}

function assignX(id, startX) {
    const w = calcWidth(id);
    const node = byId(id);
    node._x = startX + w/2 - NODE_W/2;
    let cx = startX;
    getKids(id).forEach(k => { assignX(k.id, cx); cx += calcWidth(k.id); });
}

function renderTree() {
    const svg = document.getElementById('tree-svg');
    const empty = document.getElementById('empty-state');
    
    document.getElementById('stat-total').textContent = people.length;
    const gens = new Set(people.map(p => getGen(p)));
    document.getElementById('stat-gen').textContent = people.length ? gens.size : 0;

    if (!people.length) {
        empty.style.display = 'block';
        svg.style.display = 'none';
        return;
    }
    empty.style.display = 'none';
    svg.style.display = 'block';

    const roots = people.filter(p => !p.parentId);
    let currentX = 20;
    roots.forEach(r => { assignX(r.id, currentX); currentX += calcWidth(r.id) + 40; });

    const maxGen = Math.max(...people.map(p => getGen(p)));
    svg.setAttribute('width', currentX + 50);
    svg.setAttribute('height', (maxGen + 1) * (NODE_H + V_GAP) + 50);

    let html = '';
    // Draw Lines
    people.forEach(p => {
        if (!p.parentId) return;
        const parent = byId(p.parentId);
        const x1 = parent._x + NODE_W/2, y1 = getGen(parent)*(NODE_H+V_GAP) + NODE_H + 20;
        const x2 = p._x + NODE_W/2, y2 = getGen(p)*(NODE_H+V_GAP) + 20;
        html += `<path class="connector" d="M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}" />`;
    });

    // Draw Nodes
    people.forEach(p => {
        const x = p._x, y = getGen(p)*(NODE_H+V_GAP) + 20;
        const color = p.parentId ? '#1a2a3e' : '#1e3a2a';
        const border = p.parentId ? '#2a4a7a' : '#2d6a46';
        
        html += `<g class="node-group" onclick="showDetail('${p.id}')">
            <rect x="${x}" y="${y}" width="${NODE_W}" height="${NODE_H}" rx="8" fill="${color}" stroke="${border}" stroke-width="1.5" />
            <text class="node-name" x="${x + NODE_W/2}" y="${y + NODE_H/2 + 5}">${p.name}</text>
        </g>`;
    });
    svg.innerHTML = html;
}

// Modal Logic
function openAddModal(preSelectedParentId = null) {
    editingId = null;
    document.getElementById('modal-title').textContent = "إضافة فرد جديد";
    document.getElementById('f-name').value = "";
    document.getElementById('del-btn').style.display = 'none';
    fillSelect();
    if (preSelectedParentId) document.getElementById('f-parent').value = preSelectedParentId;
    document.getElementById('modal').classList.add('open');
}

function fillSelect(excludeId = null) {
    const sel = document.getElementById('f-parent');
    sel.innerHTML = '<option value="">— جذر الشجرة (لا يوجد أب) —</option>';
    people.filter(p => p.id !== excludeId).forEach(p => {
        sel.innerHTML += `<option value="${p.id}">${p.name}</option>`;
    });
}

function savePerson() {
    const name = document.getElementById('f-name').value.trim();
    const parentId = document.getElementById('f-parent').value || null;
    if (!name) return alert("الرجاء إدخال الاسم");

    if (editingId) {
        const p = byId(editingId);
        p.name = name; p.parentId = parentId;
    } else {
        people.push({ id: Date.now().toString(), name, parentId });
    }
    save(); closeModal(); renderTree();
}

function showDetail(id) {
    const p = byId(id);
    const parent = byId(p.parentId);
    const sons = getKids(id);
    
    document.getElementById('d-name').textContent = p.name;
    let info = `
        <div class="detail-row"><span class="detail-label">الأب</span><div class="detail-value">${parent ? parent.name : 'أصل الشجرة'}</div></div>
        <div class="detail-row"><span class="detail-label">الأبناء (${sons.length})</span><div class="detail-value">${sons.map(s => s.name).join('، ') || 'لا يوجد'}</div></div>
    `;
    document.getElementById('d-body').innerHTML = info;
    document.getElementById('d-edit').onclick = () => { closeDetail(); openEdit(id); };
    document.getElementById('d-add-son').onclick = () => { closeDetail(); openAddModal(id); };
    document.getElementById('detail-modal').classList.add('open');
}

function openEdit(id) {
    editingId = id;
    const p = byId(id);
    document.getElementById('modal-title').textContent = "تعديل البيانات";
    document.getElementById('f-name').value = p.name;
    document.getElementById('del-btn').style.display = 'block';
    fillSelect(id);
    document.getElementById('f-parent').value = p.parentId || "";
    document.getElementById('modal').classList.add('open');
}

function deletePerson() {
    if (!confirm("سيتم حذف الشخص وتحويل أبنائه إلى جده، هل أنت متأكد؟")) return;
    const p = byId(editingId);
    getKids(editingId).forEach(k => k.parentId = p.parentId);
    people = people.filter(x => x.id !== editingId);
    save(); closeModal(); renderTree();
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeDetail() { document.getElementById('detail-modal').classList.remove('open'); }

function exportData() {
    const blob = new Blob([JSON.stringify(people)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'family-tree.json'; a.click();
}

function handleImport(e) {
    const reader = new FileReader();
    reader.onload = (ev) => {
        people = JSON.parse(ev.target.result);
        save(); renderTree();
    };
    reader.readAsText(e.target.files[0]);
}

renderTree();
</script>
</body>
</html>
