<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شجرة العائلة الاحترافية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8d08a;
    --gold-dark: #8b6914;
    --bg-deep: #0d0a05;
    --bg-card: #1a1308;
    --text: #f0e6c8;
    --border: #3d2e0e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    height: 100vh;
    overflow: hidden; /* لمنع سكرول الصفحة الرئيسي والاعتماد على تحريك الشجرة */
  }

  /* واجهة التحكم ثابتة */
  .ui-layer {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    pointer-events: none; /* للسماح بالضغط على ما تحتها */
  }
  .ui-content { pointer-events: auto; }

  .header { text-align: center; padding: 20px; background: linear-gradient(to bottom, var(--bg-deep), transparent); }
  .header h1 { font-family: 'Amiri', serif; font-size: 2.5rem; color: var(--gold-light); }

  .controls { 
    display: flex; gap: 10px; justify-content: center; padding: 10px; 
    background: rgba(26, 19, 8, 0.8); backdrop-filter: blur(5px);
    border-bottom: 1px solid var(--border);
  }
  
  .btn {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--gold-dark);
    background: rgba(201,168,76,0.1); color: var(--gold-light);
    cursor: pointer; font-weight: 600; transition: 0.3s; font-family: inherit;
  }
  .btn:hover { background: var(--gold-dark); color: #000; }
  .btn.primary { background: var(--gold); color: #000; }

  /* منطقة الشجرة المتحركة */
  .viewport {
    width: 100vw; height: 100vh;
    cursor: grab; overflow: hidden;
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .viewport:active { cursor: grabbing; }
  
  #tree-container {
    transform-origin: 0 0;
    will-change: transform;
    padding: 500px; /* مساحة واسعة للتحريك */
  }

  .connector { fill: none; stroke: var(--gold-dark); stroke-width: 2; opacity: 0.5; }
  .node-group { cursor: pointer; }
  .node-rect { fill: var(--bg-card); stroke: var(--gold); stroke-width: 1.5; transition: 0.3s; }
  .node-group:hover .node-rect { fill: var(--gold-dark); }
  .node-name { font-size: 14px; font-weight: 700; fill: #f0e6c8; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--gold); border-radius: 12px;
    width: min(400px, 90vw); padding: 25px;
  }
  .form-group { margin-bottom: 15px; }
  .form-group input, .form-group select {
    width: 100%; padding: 10px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 6px;
  }

  /* تحسينات الطباعة */
  @media print {
    body { overflow: visible; height: auto; background: white !important; }
    .ui-layer, .modal-overlay { display: none !important; }
    .viewport { cursor: default; overflow: visible; width: 100%; height: auto; background: none; }
    #tree-container { transform: none !important; padding: 0 !important; }
    #tree-svg { width: 100% !important; height: auto !important; }
    .node-rect { fill: #f9f9f9 !important; stroke: #000 !important; }
    .node-name { fill: #000 !important; }
    .connector { stroke: #333 !important; }
  }
</style>
</head>
<body>

<div class="ui-layer">
  <div class="ui-content">
    <div class="header"><h1>شجرة العائلة</h1></div>
    <div class="controls">
      <button class="btn primary" onclick="openAddModal()">＋ إضافة</button>
      <button class="btn" onclick="zoomIn()">➕ تكبير</button>
      <button class="btn" onclick="zoomOut()">➖ تصغير</button>
      <button class="btn" onclick="window.print()">🖨 طباعة</button>
      <button class="btn" onclick="exportData()">💾 تصدير</button>
      <button class="btn" onclick="document.getElementById('imp').click()">📂 استيراد</button>
    </div>
  </div>
</div>

<div class="viewport" id="viewport">
  <div id="tree-container">
    <svg id="tree-svg"></svg>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title" style="margin-bottom:15px;">إضافة فرد</h2>
    <div class="form-group"><input type="text" id="f-name" placeholder="الاسم الكامل"></div>
    <div class="form-group"><select id="f-parent"></select></div>
    <div style="display:flex; gap:10px;">
      <button class="btn primary" style="flex:1" onclick="savePerson()">حفظ</button>
      <button class="btn" style="background:#444" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<input type="file" id="imp" style="display:none" onchange="handleImport(event)">

<script>
const NODE_W = 160, NODE_H = 50, H_GAP = 40, V_GAP = 80;
let people = JSON.parse(localStorage.getItem('family_v4') || '[]');
let scale = 1, offsetX = 0, offsetY = 0;

// نظام التحريك (Pan)
const viewport = document.getElementById('viewport');
const container = document.getElementById('tree-container');
let isDragging = false, startX, startY;

viewport.addEventListener('mousedown', e => {
  if(e.target.id !== 'viewport' && e.target.tagName !== 'svg') return;
  isDragging = true;
  startX = e.pageX - offsetX;
  startY = e.pageY - offsetY;
});

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  offsetX = e.pageX - startX;
  offsetY = e.pageY - startY;
  updateTransform();
});

window.addEventListener('mouseup', () => isDragging = false);

// التكبير والتصغير
function zoomIn() { scale += 0.1; updateTransform(); }
function zoomOut() { scale = Math.max(0.2, scale - 0.1); updateTransform(); }
function updateTransform() {
  container.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
}

// رسم الشجرة (نفس المنطق السابق مع تحسينات الأبعاد)
const save = () => localStorage.setItem('family_v4', JSON.stringify(people));
const byId = id => people.find(p => p.id === id);
const getKids = id => people.filter(p => p.parentId === id);

function getWidth(id) {
  const kids = getKids(id);
  return kids.length === 0 ? NODE_W + H_GAP : kids.reduce((a, b) => a + getWidth(b.id), 0);
}

function assignPos(id, x, y) {
  const node = byId(id);
  const w = getWidth(id);
  node._x = x + w/2 - NODE_W/2;
  node._y = y;
  let curX = x;
  getKids(id).forEach(k => { assignPos(k.id, curX, y + NODE_H + V_GAP); curX += getWidth(k.id); });
}

function render() {
  const svg = document.getElementById('tree-svg');
  if (!people.length) return svg.innerHTML = '';
  
  const roots = people.filter(p => !p.parentId);
  let startX = 50;
  roots.forEach(r => { assignPos(r.id, startX, 50); startX += getWidth(r.id) + 100; });

  svg.setAttribute('width', startX + 500);
  svg.setAttribute('height', 2000); // مساحة افتراضية كبيرة

  let html = '';
  people.forEach(p => {
    if (p.parentId) {
      const par = byId(p.parentId);
      html += `<path class="connector" d="M${par._x + NODE_W/2},${par._y + NODE_H} L${par._x + NODE_W/2},${par._y + NODE_H + V_GAP/2} L${p._x + NODE_W/2},${par._y + NODE_H + V_GAP/2} L${p._x + NODE_W/2},${p._y}" />`;
    }
    html += `<g class="node-group" onclick="editPerson('${p.id}')">
      <rect class="node-rect" x="${p._x}" y="${p._y}" width="${NODE_W}" height="${NODE_H}" rx="8" />
      <text class="node-name" x="${p._x + NODE_W/2}" y="${p._y + NODE_H/2 + 5}">${p.name}</text>
    </g>`;
  });
  svg.innerHTML = html;
}

// أزرار الواجهة
function openAddModal() {
  document.getElementById('f-name').value = '';
  const sel = document.getElementById('f-parent');
  sel.innerHTML = '<option value="">— أصل الشجرة —</option>';
  people.forEach(p => sel.innerHTML += `<option value="${p.id}">${p.name}</option>`);
  document.getElementById('modal').classList.add('open');
}

function savePerson() {
  const name = document.getElementById('f-name').value;
  const parentId = document.getElementById('f-parent').value;
  if (!name) return;
  people.push({ id: 'i'+Date.now(), name, parentId: parentId || null });
  save(); closeModal(); render();
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function exportData() {
  const blob = new Blob([JSON.stringify(people)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'family.json'; a.click();
}

function handleImport(e) {
  const reader = new FileReader();
  reader.onload = (ev) => { people = JSON.parse(ev.target.result); save(); render(); };
  reader.readAsText(e.target.files[0]);
}

render();
</script>
</body>
</html>
