<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شجرة العائلة - النسخة المستقرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --bg: #0d0a05;
            --card: #1a1308;
            --text: #f0e6c8;
        }

        /* تنسيق الصفحة العام */
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* شريط الأدوات ثابت في الأعلى */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--card);
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold);
            font-weight: bold;
            font-family: inherit;
        }

        .btn:hover { background: var(--gold); color: black; }
        .btn-primary { background: var(--gold); color: black; }

        /* منطقة الشجرة مع سكرول حقيقي */
        .tree-viewport {
            width: 100%;
            overflow: auto; /* هذا يسمح بالتحريك يميناً ويساراً وبكل اتجاه */
            padding: 50px;
            display: block;
        }

        #tree-svg {
            display: block;
            margin: 0 auto;
        }

        /* تصميم العقد والروابط */
        .node-rect { fill: var(--card); stroke: var(--gold); stroke-width: 2; cursor: pointer; }
        .node-text { fill: var(--text); font-size: 14px; font-weight: bold; text-anchor: middle; pointer-events: none; }
        .link { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0.4; }

        /* النافذة المنبثقة */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal {
            background: var(--card); border: 1px solid var(--gold);
            padding: 30px; border-radius: 10px; width: 350px;
        }
        .modal input, .modal select {
            width: 100%; padding: 10px; margin: 10px 0;
            background: #000; border: 1px solid #444; color: white;
        }

        /* إعدادات الطباعة النهائية */
        @media print {
            @page { size: landscape; margin: 10mm; }
            body { background: white !important; color: black !important; }
            .toolbar, .modal-bg { display: none !important; }
            .tree-viewport { overflow: visible !important; padding: 0 !important; }
            #tree-svg { width: 100% !important; height: auto !important; max-height: 100% !important; }
            .node-rect { fill: #f9f9f9 !important; stroke: black !important; }
            .node-text { fill: black !important; }
            .link { stroke: black !important; }
        }
    </style>
</head>
<body>

<div class="toolbar">
    <button class="btn btn-primary" onclick="openAddModal()">＋ إضافة فرد</button>
    <button class="btn" onclick="exportJSON()">⬇ تصدير</button>
    <button class="btn" onclick="document.getElementById('importInput').click()">⬆ استيراد</button>
    <button class="btn" onclick="window.print()">🖨 طباعة الشجرة</button>
</div>

<div class="tree-viewport">
    <svg id="tree-svg"></svg>
</div>

<div class="modal-bg" id="modal">
    <div class="modal">
        <h3 id="modal-title">إضافة فرد</h3>
        <input type="text" id="node-name" placeholder="الاسم الكامل">
        <select id="node-parent"></select>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-primary" style="flex:1" onclick="saveNode()">حفظ</button>
            <button class="btn" style="flex:1" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<input type="file" id="importInput" style="display:none" onchange="importJSON(event)">

<script>
    let people = JSON.parse(localStorage.getItem('family_tree_data') || '[]');
    const W = 150, H = 45, V_GAP = 70, H_GAP = 30;

    function render() {
        const svg = document.getElementById('tree-svg');
        if (!people.length) { svg.innerHTML = ''; return; }

        // حساب المسافات
        const getKids = (pid) => people.filter(p => p.parentId === pid);
        const calcW = (id) => {
            const kids = getKids(id);
            return kids.length === 0 ? W + H_GAP : kids.reduce((acc, k) => acc + calcW(k.id), 0);
        };

        const roots = people.filter(p => !p.parentId);
        let startX = 0;
        
        // توزيع المواقع
        const layout = (id, x, y) => {
            const p = people.find(n => n.id === id);
            const w = calcW(id);
            p.x = x + w/2 - W/2;
            p.y = y;
            let currentX = x;
            getKids(id).forEach(k => {
                layout(k.id, currentX, y + H + V_GAP);
                currentX += calcW(k.id);
            });
        };

        roots.forEach(r => { layout(r.id, startX, 20); startX += calcW(r.id) + 50; });

        // الرسم
        svg.setAttribute('width', startX);
        svg.setAttribute('height', Math.max(...people.map(p => p.y)) + 100);

        let linksHtml = '', nodesHtml = '';
        people.forEach(p => {
            if (p.parentId) {
                const parent = people.find(n => n.id === p.parentId);
                linksHtml += `<path class="link" d="M${parent.x + W/2},${parent.y + H} V${parent.y + H + V_GAP/2} H${p.x + W/2} V${p.y}" />`;
            }
            nodesHtml += `
                <g onclick="openEditModal('${p.id}')">
                    <rect class="node-rect" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="5" />
                    <text class="node-text" x="${p.x + W/2}" y="${p.y + H/2 + 5}">${p.name}</text>
                </g>`;
        });
        svg.innerHTML = linksHtml + nodesHtml;
        localStorage.setItem('family_tree_data', JSON.stringify(people));
    }

    // إدارة البيانات
    let editId = null;
    function openAddModal() {
        editId = null;
        document.getElementById('modal-title').innerText = "إضافة فرد جديد";
        document.getElementById('node-name').value = '';
        updateSelect();
        document.getElementById('modal').style.display = 'flex';
    }

    function openEditModal(id) {
        editId = id;
        const p = people.find(n => n.id === id);
        document.getElementById('modal-title').innerText = "تعديل: " + p.name;
        document.getElementById('node-name').value = p.name;
        updateSelect(id);
        document.getElementById('node-parent').value = p.parentId || '';
        document.getElementById('modal').style.display = 'flex';
    }

    function updateSelect(excludeId = null) {
        const sel = document.getElementById('node-parent');
        sel.innerHTML = '<option value="">— بلا أب (جذر) —</option>';
        people.forEach(p => {
            if (p.id !== excludeId) sel.innerHTML += `<option value="${p.id}">${p.name}</option>`;
        });
    }

    function saveNode() {
        const name = document.getElementById('node-name').value;
        const parentId = document.getElementById('node-parent').value;
        if (!name) return;

        if (editId) {
            const p = people.find(n => n.id === editId);
            p.name = name; p.parentId = parentId || null;
        } else {
            people.push({ id: 'p' + Date.now(), name, parentId: parentId || null });
        }
        closeModal(); render();
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    // التصدير والاستيراد
    function exportJSON() {
        const data = JSON.stringify(people);
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'family_tree.json'; a.click();
    }

    function importJSON(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            people = JSON.parse(ev.target.result);
            render();
        };
        reader.readAsText(e.target.files[0]);
    }

    render();
</script>

</body>
</html>
